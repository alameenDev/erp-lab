<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab banner test harness</title></head>
<body style="margin:0;background:#f5f8fc;font-family:Arial,sans-serif"><div id="app"></div>
<script type="module">
import { createApp, h, ref } from 'vue';
import PrimeVue from 'primevue/config';
import Aura from '@primevue/themes/aura';
import LabHomeBanners from '../src/components/banners/LabHomeBanners.vue';
const view = ref('dashboard');
window.setBannerView = (value) => { view.value = value; };
// The application uses the runtime-only Vue build. Compile-free render functions
// make the harness exercise the same components without a runtime compiler alias.
const app = createApp({ setup: () => () => h('main', { style: 'padding:16px;box-sizing:border-box;width:100%' }, [
  h('div', { 'data-testid': 'notifications', style: 'padding:16px;margin-bottom:16px;background:white' }, 'إشعارات الإدارة'),
  ['dashboard', 'admin'].includes(view.value) ? h(LabHomeBanners, { key: view.value }) : null,
  h('h1', { 'data-testid': 'welcome' }, 'مرحباً بكم في المختبر'),
]) });
app.use(PrimeVue, { theme: { preset: Aura } }); app.mount('#app');
</script></body></html>
