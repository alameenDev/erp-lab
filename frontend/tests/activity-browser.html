<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>سجل النشاط — بيانات تجريبية</title></head><body style="background:#f8fafc;margin:24px"><div id="app"></div>
<script type="module">
import { createApp } from 'vue';
import { createPinia } from 'pinia';
import View from '/src/views/activityLogger/index.vue';
import { $http } from '/src/plugins/axios';
import { installActivityAudit } from '/src/utils/activityAudit';
import '/src/assets/main.css';
import 'primeicons/primeicons.css';
window.auditRequests = []; window.uiActions = [];
localStorage.setItem('token', 'synthetic-audit-token');
window.fetch = async (url, options) => { window.uiActions.push(...JSON.parse(options.body).actions); return new Response('{}', { status: 200 }); };
const base = { id: 1, event: 'updated', log_name: 'تعديل', description: 'تعديل نتائج التحاليل', created_at: '2026-10-05T09:30:00Z',
  causer_id: 3, causer_name: 'موظف تجريبي', causer_role: 'موظف مختبر', invoice: { id: 42, barcode: 'SAMPLE-42', patient_name: 'مريض تجريبي' },
  source: 'server', status: 'success', button: 'حفظ النتيجة', page: '/medical_reports/update-result/42', change_count: 2,
  changes: [{ field: 'analyses.test_1_1.result', label: 'analyses / test_1_1 (CBC) / result', before: '10', after: '15', kind: 'changed' },
    { field: 'invoice.total', label: 'invoice / total', before: 20000, after: 25000, kind: 'changed' }],
  properties: { old_value: { total: 20000 }, new_value: { total: 25000 } },
};
$http.defaults.adapter = async config => {
  window.auditRequests.push({ url: config.url, params: config.params, headers: { ...config.headers } });
  let data;
  if (config.url === '/activity/show') {
    const page = Number(config.params?.page || 1);
    const matches = !config.params?.invoice_id || Number(config.params.invoice_id) === 42;
    data = { data: matches ? [{ ...base, id: page }, { ...base, id: page + 100, event: 'deleted', log_name: 'حذف', description: 'حذف فاتورة', changes: [{ field:'analyses.test_1_1.result', label:'analyses / test_1_1 (CBC) / result', before:'10', after:null, kind:'removed' }], change_count:1 }] : [],
      pagination: { current_page: page, per_page: 25, last_page: matches ? 2 : 1, total: matches ? 50 : 0 }, stats: { total: matches ? 50 : 0, changed: 40, failed: 2, clicks: 8 } };
  } else if (config.url.startsWith('/activity/show/')) data = { ...base, id: Number(config.url.split('/').at(-1)) };
  else if (config.url === '/activity/export') data = new Blob(['record,before,after\n1,10,15'], { type: 'text/csv' });
  else if (config.url === '/invoices/send') data = { message:'synthetic' };
  else throw new Error('Unexpected request: ' + config.url);
  return { data, status: 200, statusText: 'OK', headers: {}, config };
};
window.syntheticMutation = () => $http.post('/invoices/send', { id:42 });
installActivityAudit();
createApp(View).use(createPinia()).mount('#app');
</script></body></html>
