<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><body class="bg-slate-50"><div id="app" class="p-4 sm:p-8"></div><script type="module">
import {createApp} from 'vue';
import {createPinia} from 'pinia';
import Subscriptions from '/src/views/super-admin/subscriptions.vue';
import Labs from '/src/views/super-admin/labs.vue';
import UiButton from '/src/components/ui/Button.vue';
import UiModal from '/src/components/ui/Modal.vue';
import {$http} from '/src/plugins/axios';
import '/src/assets/main.css';
localStorage.setItem('locale','ar');localStorage.setItem('token','synthetic-renewal');
const app=createApp(new URLSearchParams(location.search).get('view')==='labs'?Labs:Subscriptions);
app.use(createPinia());app.component('UiButton',UiButton);app.component('UiModal',UiModal);
const lab={id:306,name:'مختبر العاصمه للتحليلات المرضية والهرمونات',email:'synthetic@example.test',phone_number:'',invoice_count:2,patient_count:1,total_revenue:50000,created_at:'2026-09-01'};
const sub={id:77,lab_id_fk:306,lab:{...lab},plan_id_fk:3,plan_name:'الخطة القياسية',status:'trial',effective_status:'expired',start_date:'2026-09-01',end_date:'2026-09-30',max_users:5,max_invoices_per_month:2000,price:25000,currency:'IQD',notes:''};
const fixture=window.renewalFixture={requests:[],fail:false,sub};
const pagination={current_page:1,per_page:25,last_page:1,total:1};
$http.defaults.adapter=async config=>{
 const body=typeof config.data==='string'?JSON.parse(config.data):config.data;
 fixture.requests.push({url:config.url,method:config.method,body});
 let data;
 if(config.url==='/plans') data=[];
 else if(config.url==='/subscriptions') data={data:[structuredClone(sub)],pagination};
 else if(config.url==='/super-admin/labs') data={data:[{...lab,subscription:structuredClone(sub)}],pagination};
 else if(config.url==='/super-admin/lab-detail/306') data={lab:{...lab,subscription:structuredClone(sub)},invoice_stats:{total:2,revenue:50000,paid:40000},patient_count:1,branch_labs:[],recent_invoices:[],monthly_revenue:[]};
 else if(config.url==='/subscriptions/77/renewal') data={subscription:structuredClone(sub),version:'a'.repeat(64),continues_current_term:sub.status==='active',renewal_start_date:sub.status==='active'?'2027-01-12':'2026-10-12',options:[{months:1,end_date:'2026-11-11'},{months:3,end_date:'2027-01-11'},{months:6,end_date:'2027-04-11'},{months:12,end_date:'2027-10-11'}]};
 else if(config.url==='/subscriptions/77/renew') {
  await new Promise(resolve=>setTimeout(resolve,200));
  if(fixture.fail){const error=Error('Conflict');error.config=config;error.response={status:409,data:{message:'تغيّر الاشتراك. حدّث التفاصيل قبل التأكيد.'}};throw error;}
  Object.assign(sub,{status:'active',effective_status:'active',start_date:'2026-10-12',end_date:'2027-01-11'});data={subscription:structuredClone(sub)};
 }
 else throw Error('Unexpected request '+config.url);
 return{data,status:200,statusText:'OK',headers:{},config};
};
app.mount('#app');
</script></body></html>
