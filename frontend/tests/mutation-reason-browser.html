<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Action-time reason prompt</title></head>
<body>
  <button id="edit">تعديل الفاتورة</button>
  <button id="delete">حذف الفاتورة</button>
  <button id="discount">حفظ خصم الفاتورة</button>
  <button id="result">حفظ نتائج التحاليل</button>
  <button id="silent">حفظ تلقائي</button>
  <script type="module">
    import {$http} from '/src/plugins/axios.js';
    const requests=[], errors=[];
    $http.defaults.adapter=async config=>{
      let payload=config.data instanceof FormData?Object.fromEntries(config.data.entries()):config.data;
      if(typeof payload==='string'){try{payload=JSON.parse(payload);}catch{}}
      requests.push({url:config.url,method:config.method,data:payload});
      return {config,status:200,statusText:'OK',data:{ok:true},headers:{}};
    };
    window.reasonFixture={requests,errors};
    const action=async(method,url,data)=>{
      try {await $http({method,url,data});}
      catch(error){errors.push({cancelled:error?.code==='ERR_CANCELED',name:error?.name});}
    };
    document.querySelector('#edit').onclick=()=>action('put','/invoices/update',{id:42,total:35000});
    document.querySelector('#delete').onclick=()=>action('delete','/invoices/delete',{id:42});
    document.querySelector('#discount').onclick=()=>action('post','/invoices/create',{patient_id_fk:7,discount:5000});
    document.querySelector('#result').onclick=()=>{const form=new FormData();form.append('id','42');action('post','/invoices/update-result',form);};
    document.querySelector('#silent').onclick=()=>{const form=new FormData();form.append('id','42');action('post','/invoices/update-result?silent=1',form);};
  </script>
</body></html>
