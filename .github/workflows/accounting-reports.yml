name: Accounting report browser verification
on:
  pull_request:
    paths:
      - 'frontend/src/views/accounting-reports/**'
      - 'frontend/src/store/modules/accountingReports.js'
      - 'frontend/tests/accounting*'
      - '.github/workflows/accounting-reports.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/accounting-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5173/tests/accounting-browser.html > /dev/null && break
            sleep 1
          done
          node tests/accounting.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accounting-reports
          path: frontend/test-results/accounting
          retention-days: 7
