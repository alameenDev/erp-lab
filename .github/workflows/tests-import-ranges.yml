name: Smart test import reference ranges
on:
  pull_request:
    paths:
      - 'backend/app/Http/Controllers/TestController.php'
      - 'backend/app/Services/TestImportDuplicateGuard.php'
      - 'backend/tests/Feature/TestImportDuplicateRangesTest.php'
      - '.github/workflows/tests-import-ranges.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test-only-password
          MARIADB_DATABASE: erp_lab_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: erp_lab_test
      DB_USERNAME: root
      DB_PASSWORD: test-only-password
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, xml, gd, zip, bcmath, intl
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php -l app/Services/TestImportDuplicateGuard.php
      - run: php -l app/Http/Controllers/TestController.php
      - run: php -l tests/Feature/TestImportDuplicateRangesTest.php
      - run: php artisan test --filter=TestImportDuplicateRangesTest
