name: Subscription renewal browser verification
on:
  pull_request:
    paths:
      - 'frontend/src/views/super-admin/**'
      - 'frontend/src/store/modules/superAdmin.js'
      - 'frontend/tests/subscription-renewal*'
      - '.github/workflows/subscription-renewal.yml'
permissions:
  contents: read
jobs:
  renewal-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install chromium
      - run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/renewal-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5173/tests/subscription-renewal-browser.html > /dev/null && break
            sleep 1
          done
          node tests/subscription-renewal.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subscription-renewal
          path: frontend/test-results/subscription-renewal
          retention-days: 7
