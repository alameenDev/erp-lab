name: Patient mobile pairing
on:
  push:
    branches: [feature/patient-mobile-link-20261007]
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/src/views/portal/PatientMobileLink.vue'
      - 'frontend/tests/patient-mobile*'
      - '.github/workflows/patient-mobile.yml'
permissions:
  contents: read
jobs:
  pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test-only-password
          MARIADB_DATABASE: erp_lab_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_DATABASE: erp_lab_test
      DB_USERNAME: root
      DB_PASSWORD: test-only-password
      PATIENT_MOBILE_DB_HOST: 127.0.0.1
      PATIENT_MOBILE_DB_DATABASE: patient_mobile_test
      PATIENT_MOBILE_DB_USERNAME: root
      PATIENT_MOBILE_DB_PASSWORD: test-only-password
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, xml, gd, zip, bcmath, intl
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Create isolated pairing fixture database
        run: php -r '(new PDO("mysql:host=127.0.0.1", "root", "test-only-password"))->exec("CREATE DATABASE patient_mobile_test");'
      - name: Syntax
        run: find app/Services/PatientMobile* app/Http/Controllers/PatientMobile* database/patient-mobile-migrations tests/Feature/PatientMobileTest.php routes/patient-mobile.php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Pairing isolation and existing loyalty behavior
        run: php artisan test --filter='PatientMobileTest|LoyaltyTest'
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/mobile-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5173/tests/patient-mobile-browser.html > /dev/null && break
            sleep 1
          done
          node tests/patient-mobile.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patient-mobile-portal-preview
          path: frontend/test-results/patient-mobile
