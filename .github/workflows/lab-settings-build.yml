name: Lab settings verification
on:
  push:
    branches: [feature/lab-settings-upgrade]
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/lab-settings-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: node --test tests/default-test-results.test.mjs tests/barcode-labels.test.mjs
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
