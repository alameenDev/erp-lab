name: Lab settings verification
on:
  push:
    branches: [feature/lab-settings-upgrade]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
