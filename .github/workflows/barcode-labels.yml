name: Barcode label print verification
on:
  pull_request:
    paths:
      - 'frontend/src/components/barcode/**'
      - 'frontend/src/utils/barcodeLabels.js'
      - 'frontend/src/views/lab-settings/BarcodeLabelDesigner.vue'
      - 'frontend/src/composables/usePrint.js'
      - 'frontend/tests/barcode*'
      - 'frontend/tests/fixtures/barcode*'
      - '.github/workflows/barcode-labels.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  print:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps
      - run: npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/barcode-ui.test.mjs
      - run: |
          python -m pip install zxing-cpp pillow pypdf
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils
          pdftoppm -png -r 203 barcode-qa/labels.pdf barcode-qa/label
          python - <<'PY'
          from pypdf import PdfReader
          from PIL import Image
          import zxingcpp
          pdf = PdfReader('barcode-qa/labels.pdf')
          assert len(pdf.pages) == 2, len(pdf.pages)
          for i, page in enumerate(pdf.pages, 1):
              assert abs(float(page.mediabox.width) * 25.4 / 72 - 50) < .5
              assert abs(float(page.mediabox.height) * 25.4 / 72 - 30) < .5
              result = zxingcpp.read_barcode(Image.open(f'barcode-qa/label-{i}.png'))
              assert result and result.text == '1234567890', result
          print('Both printed PDF labels decoded correctly at 203 DPI; exact 50 x 30 mm pages.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: barcode-label-qa
          path: frontend/barcode-qa
