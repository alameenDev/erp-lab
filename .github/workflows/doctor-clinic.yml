name: Doctor clinic portal verification
on:
  pull_request:
    paths:
      - 'backend/app/Http/Controllers/DoctorClinicController.php'
      - 'backend/app/Models/DoctorClinic*.php'
      - 'backend/database/migrations/*doctor_clinic*'
      - 'backend/tests/Feature/DoctorClinicTest.php'
      - 'backend/routes/api.php'
      - 'frontend/src/views/doctor-portal/**'
      - 'frontend/src/layout/DoctorPortalLayout.vue'
      - 'frontend/src/router/index.js'
      - '.github/workflows/doctor-clinic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clinic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test-only-password
          MARIADB_DATABASE: erp_lab_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: erp_lab_test
      DB_USERNAME: root
      DB_PASSWORD: test-only-password
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, xml, gd, zip, bcmath, intl
          tools: composer:v2
          coverage: none
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Configure app
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Verify PHP syntax
        working-directory: backend
        run: |
          php -l app/Http/Controllers/DoctorClinicController.php
          php -l app/Models/DoctorClinicPatient.php
          php -l app/Models/DoctorClinicVisit.php
          php -l app/Models/DoctorClinicVisitRevision.php
          php -l database/migrations/2026_11_01_000001_create_doctor_clinic_tables.php
      - name: Test clinic access and clinical records
        working-directory: backend
        run: php artisan test --filter='DoctorClinicTest|DoctorPortalTest'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build doctor portal
        working-directory: frontend
        run: npm run build
