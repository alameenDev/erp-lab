name: High contrast monochrome reports
on:
  pull_request:
    paths:
      - 'frontend/src/utils/reportMonochrome.js'
      - 'frontend/src/utils/medicalReportTemplate.js'
      - 'frontend/src/utils/medicalReportPages.js'
      - 'frontend/src/composables/usePrint.js'
      - 'frontend/src/views/medical_reports/**'
      - 'frontend/src/views/lab-settings/ReportTemplatePreview.vue'
      - 'frontend/tests/report-monochrome*'
      - '.github/workflows/report-monochrome.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monochrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test tests/report-monochrome.test.mjs
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - name: Verify real monochrome report output
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/monochrome-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5173/tests/report-monochrome-browser.html > /dev/null && break
            sleep 1
          done
          node tests/report-monochrome.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-monochrome
          path: frontend/test-results/report-monochrome
          retention-days: 7
