name: Activity audit verification
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/src/utils/activity*'
      - 'frontend/src/views/activityLogger/**'
      - 'frontend/src/store/modules/activityLogger.js'
      - 'frontend/src/plugins/axios.js'
      - 'frontend/src/main.js'
      - 'frontend/tests/*activity*'
      - '.github/workflows/activity-audit.yml'
permissions:
  contents: read
jobs:
  audit-database:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test-only-password
          MARIADB_DATABASE: erp_lab_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: erp_lab_test
      DB_USERNAME: root
      DB_PASSWORD: test-only-password
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, xml, gd, zip, bcmath, intl
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test --filter=ActivityAuditTest
      - if: failure()
        run: tail -100 storage/logs/laravel.log
  audit-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/audit-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5173/tests/activity-browser.html > /dev/null && break
            sleep 1
          done
          node tests/activity.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activity-audit-preview
          path: frontend/test-results/activity
          retention-days: 7
