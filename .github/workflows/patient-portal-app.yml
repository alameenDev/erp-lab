name: Patient portal app experience
on:
  pull_request:
    paths:
      - 'frontend/src/views/portal/**'
      - 'frontend/src/composables/usePatientPortalApp.js'
      - 'frontend/src/utils/patientPortalApp.js'
      - 'frontend/public/portal/**'
      - 'frontend/tests/patient-portal-*'
      - '.github/workflows/patient-portal-app.yml'
permissions:
  contents: read
jobs:
  portal-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --test tests/patient-portal-app.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/portal-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5173/tests/patient-portal-app-browser.html > /dev/null && break
            sleep 1
          done
          node tests/patient-portal-app.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patient-portal-app-preview
          path: frontend/test-results/patient-portal
          retention-days: 7
