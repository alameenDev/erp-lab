name: Build DxH Windows bridge
on:
  push:
    branches: [codex/dxh500-simple-bridge]
    paths: ['bridge/**', '.github/workflows/dxh-bridge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test receiver and outbox
        run: python -m unittest discover -s bridge/tests -v
      - name: Check Windows setup window
        run: python bridge/desktop.py --smoke-test
      - run: python -m pip install pyinstaller==6.16.0
      - name: Build standalone executable
        working-directory: bridge
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name DigitalLabBridge desktop.py
      - name: Check packaged executable
        shell: pwsh
        run: |
          $process = Start-Process bridge/dist/DigitalLabBridge.exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Packaged bridge failed to start' }
          Copy-Item bridge/README_AR.md bridge/dist/README_AR.md
      - uses: actions/upload-artifact@v4
        with:
          name: DigitalLabBridge-Windows
          path: bridge/dist/
          retention-days: 30
