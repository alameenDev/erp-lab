name: Lab announcements verification
on:
  pull_request:
    paths:
      - 'backend/app/Http/Controllers/LabAnnouncementController.php'
      - 'backend/app/Providers/LabAnnouncementServiceProvider.php'
      - 'backend/bootstrap/providers.php'
      - 'backend/routes/lab-announcements.php'
      - 'backend/database/migrations/*lab_announcements*'
      - 'backend/tests/Feature/LabAnnouncementTest.php'
      - 'frontend/src/components/announcements/**'
      - 'frontend/src/utils/labAnnouncements.js'
      - 'frontend/src/layout/AppLayout.vue'
      - 'frontend/tests/lab-announcements*'
      - '.github/workflows/lab-announcements.yml'
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test-only-password
          MARIADB_DATABASE: erp_lab_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: erp_lab_test
      DB_USERNAME: root
      DB_PASSWORD: test-only-password
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, xml, gd, zip, bcmath, intl
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: find app database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php artisan test --filter=LabAnnouncementTest
      - run: php artisan route:list --path=lab-announcements
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_BASE_URL: /api
      ANNOUNCEMENT_PLAYWRIGHT_MODULE: /tmp/announcement-browser-tools/node_modules/playwright/index.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      # Keep application dependencies exactly as locked; install browser tooling separately.
      - run: npm install --prefix /tmp/announcement-browser-tools --no-save --package-lock=false playwright@1.55.1
      - run: /tmp/announcement-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/announcements-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5173/tests/lab-announcements-browser.html > /dev/null && break
            sleep 1
          done
          node tests/lab-announcements.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-announcements-browser
          path: frontend/test-results/lab-announcements
          retention-days: 7
