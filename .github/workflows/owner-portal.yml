name: Owner portal
on:
  pull_request:
    paths:
      - 'backend/app/**'
      - 'backend/routes/api.php'
      - 'backend/routes/console.php'
      - 'backend/tests/Feature/OwnerNotificationTest.php'
      - 'frontend/public/owner-portal/**'
      - 'frontend/src/composables/useOwnerPortalApp.js'
      - 'frontend/src/utils/ownerPortalApp.js'
      - 'backend/database/migrations/**'
      - 'backend/tests/Feature/OwnerPortalTest.php'
      - 'frontend/src/views/owner-portal/**'
      - 'frontend/src/views/super-admin/owners.vue'
      - 'frontend/src/utils/accessControl.js'
      - 'frontend/src/store/modules/auth.js'
      - 'frontend/src/router/index.js'
      - 'frontend/tests/owner-portal*'
      - '.github/workflows/owner-portal.yml'
permissions:
  contents: read
jobs:
  owner-database:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test-only-password
          MARIADB_DATABASE: erp_lab_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: erp_lab_test
      DB_USERNAME: root
      DB_PASSWORD: test-only-password
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, xml, gd, zip, bcmath, intl
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test --filter='OwnerNotificationTest|OwnerPortalTest|AccountingReportsTest|ActivityAuditTest|AccountPermissionsTest|PortalPushTransportTest|PortalNotificationTest'
      - if: failure()
        run: test ! -f storage/logs/laravel.log || tail -100 storage/logs/laravel.log
  owner-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - name: Prepare Chromium
        timeout-minutes: 5
        run: |
          if command -v google-chrome > /dev/null; then
            echo "OWNER_CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/owner-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5173/ > /dev/null && break
            sleep 1
          done
          node tests/owner-portal.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-portal-preview
          path: frontend/test-results/owner-portal
          retention-days: 14
