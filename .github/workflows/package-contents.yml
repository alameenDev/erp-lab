name: Package contents verification
on:
  pull_request:
    paths:
      - 'frontend/src/views/packages/**'
      - 'frontend/src/store/modules/packages.js'
      - 'frontend/tests/package-contents*'
      - '.github/workflows/package-contents.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/package-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5173/tests/package-contents-browser.html > /dev/null && break
            sleep 1
          done
          node tests/package-contents.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-contents
          path: frontend/test-results/package-contents
          retention-days: 7
