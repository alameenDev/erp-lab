name: digital-lab-local
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: digital_lab_local
      MARIADB_USER: digital_lab
      MARIADB_PASSWORD: ${LOCAL_DB_PASSWORD:?Generate .env.local first}
      MARIADB_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD:?Generate .env.local first}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    image: digital-lab-local-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:80'
    environment:
      APP_NAME: Digital Lab Local Trial
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: ${LOCAL_APP_KEY:?Generate .env.local first}
      APP_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      APP_TIMEZONE: Asia/Baghdad
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: digital_lab_local
      DB_USERNAME: digital_lab
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:?Generate .env.local first}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      MAIL_MAILER: log
      LOG_CHANNEL: stderr
    volumes:
      - storage:/var/www/backend/storage
    healthcheck:
      test: [CMD, php, -r, 'exit(@file_get_contents("http://127.0.0.1/up") === false ? 1 : 0);']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
volumes:
  database:
  storage:
